<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/favicon.ico" />

    <!-- Default meta tags - Will be overridden by React Helmet on each page -->
    <title>Hackethos4U - Cybersecurity Training & VAPT Services</title>
    <meta name="description" content="Professional cybersecurity training and VAPT services. Learn ethical hacking, penetration testing, and security testing." />

    <!-- CRITICAL: Firebase Preconnects FIRST - Save ~950ms on critical path -->
    <!-- These must be first to establish connections before JavaScript loads -->
    <link rel="preconnect" href="https://hackthous4u-website.firebaseapp.com" crossorigin>
    <link rel="preconnect" href="https://www.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://firebase.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
    <link rel="preconnect" href="https://securetoken.googleapis.com" crossorigin>

    <!-- DNS Prefetch as fallback for older browsers -->
    <link rel="dns-prefetch" href="https://hackthous4u-website.firebaseapp.com">
    <link rel="dns-prefetch" href="https://www.googleapis.com">
    <link rel="dns-prefetch" href="https://firestore.googleapis.com">
    <link rel="dns-prefetch" href="https://firebase.googleapis.com">
    <link rel="dns-prefetch" href="https://identitytoolkit.googleapis.com">
    <link rel="dns-prefetch" href="https://securetoken.googleapis.com">

    <!-- Performance optimization - Font Loading (lower priority than Firebase) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" as="style">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    </noscript>

    <!-- Additional DNS prefetch for fonts -->
    <link rel="dns-prefetch" href="https://fonts.googleapis.com">
    <link rel="dns-prefetch" href="https://fonts.gstatic.com">

    <!-- Preload critical JavaScript modules -->
    <link rel="modulepreload" href="/src/main.tsx" />
    <link rel="modulepreload" href="/src/App.tsx" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json">

    <!-- Theme color for mobile browsers (Orange brand color) -->
    <meta name="theme-color" content="#ff6600" />

    <!-- Critical CSS - Inline minimal styles to prevent render blocking and layout shift -->
    <style>
      /* Critical CSS for fastest first paint and zero layout shift */
      :root{--background:0 0% 100%;--foreground:222.2 84% 4.9%;--primary:217 91% 60%;--primary-foreground:210 40% 98%;--accent:189 94% 43%;--border:214.3 31.8% 91.4%;--radius:0.5rem}*{border-color:hsl(var(--border));box-sizing:border-box}body{margin:0;background-color:hsl(var(--background));color:hsl(var(--foreground));font-family:Inter,system-ui,-apple-system,sans-serif;-webkit-font-smoothing:antialiased;line-height:1.5;min-height:100vh;overflow-x:hidden}header{position:sticky;top:0;z-index:50;width:100%;backdrop-filter:blur(8px)}.container{width:100%;margin-left:auto;margin-right:auto;padding-left:1rem;padding-right:1rem;max-width:1280px}#root{min-height:100vh;display:flex;flex-direction:column}img,video,iframe{max-width:100%;height:auto;display:block}button{cursor:pointer}
    </style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
